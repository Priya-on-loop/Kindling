<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore your curiosity with Kindling."
    >

    <title>Signals — Kindling</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <a
                href="../index.html"
                class="navbar-logo"
                aria-label="Kindling home"
            >
                <span class="navbar-logo-mark"></span>
                <span>KINDLING</span>
            </a>


            <nav
                class="navbar-links"
                aria-label="Main navigation"
            >

                <a
                    href="./signals.html"
                    class="navbar-link active"
                >
                    Signals
                </a>

                <a
                    href="./inference.html"
                    class="navbar-link"
                >
                    Inference
                </a>

                <a
                    href="./career-graph.html"
                    class="navbar-link"
                >
                    Career Graph
                </a>

                <a
                    href="./user-control.html"
                    class="navbar-link"
                >
                    User Control
                </a>

                <a
                    href="./about.html"
                    class="navbar-link"
                >
                    About
                </a>

            </nav>


            <button
                type="button"
                class="navbar-action"
                id="signInButton"
            >
                Sign in
            </button>


            <button
                class="navbar-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >

                <span class="navbar-menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         SIGNALS
         ===================================================== -->

    <main class="signals-page">

        <section class="signals-section">

            <div class="signals-container">

                <!-- Welcome state -->

                <div
                    class="signals-welcome"
                    id="signalsWelcome"
                >

                    <p class="signals-welcome-label">
                        KINDLING
                    </p>

                    <h1 class="signals-welcome-title">
                        Let's get curious.
                    </h1>

                    <p
                        class="signals-question"
                        id="openingQuestion"
                    >
                        What have you been exploring lately?
                    </p>

                </div>


                <!-- Conversation -->

                <div
                    class="chat-container"
                    id="chatContainer"
                >

                    <div
                        class="chat-messages"
                        id="chatMessages"
                        aria-live="polite"
                    >
                    </div>

                </div>


                <!-- Input -->

                <div class="signals-input-area">

                    <form
                        class="chat-form"
                        id="chatForm"
                    >

                        <div class="chat-input-wrapper">

                            <textarea
                                id="chatInput"
                                class="chat-input"
                                rows="1"
                                placeholder="Tell us what's on your mind..."
                                aria-label="Your response"
                                required
                            ></textarea>


                            <button
                                type="submit"
                                class="chat-send"
                                id="chatSend"
                                aria-label="Send response"
                            >

                                <span class="chat-send-icon">
                                    ↑
                                </span>

                            </button>

                        </div>


                        <div class="chat-meta">

                            <span>
                                No right answers. Just explore.
                            </span>

                            <span id="questionProgress">
                                Question 1 of 5
                            </span>

                        </div>

                    </form>


                    <!-- Loading -->

                    <div
                        class="chat-loading"
                        id="chatLoading"
                        aria-hidden="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         SIGN IN MODAL
         ===================================================== -->

    <div
        class="modal"
        id="signInModal"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="signInTitle"
        >

            <button
                type="button"
                class="modal-close"
                id="modalClose"
                aria-label="Close sign in"
            >
                ×
            </button>


            <div class="modal-header">

                <div class="modal-logo">

                    <span class="navbar-logo-mark"></span>

                    <span>KINDLING</span>

                </div>


                <h2
                    class="modal-title"
                    id="signInTitle"
                >
                    Welcome back.
                </h2>


                <p class="modal-description">
                    Continue exploring where your curiosity
                    can take you.
                </p>

            </div>


            <form
                class="modal-form"
                id="signInForm"
            >

                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="modal-submit"
                >
                    Sign in
                </button>

            </form>


            <div class="modal-footer">

                Don't have an account?

                <a href="#" id="createAccount">
                    Create one
                </a>

            </div>

        </div>

    </div>



    <script src="../js/components/navbar.js"></script>

    <script src="../js/components/modal.js"></script>

    <script src="../js/pages/signals.js"></script>

    <script>

        initializeNavbar();

        initializeModal();

        initializeSignals();

    </script>

</body>

</html>
