<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Kindling Signals — explore what you're curious about."
    >

    <title>Signals — Kindling</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Global styles -->
    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

    <!-- Signals styles -->
    <link
        rel="stylesheet"
        href="../css/components/navbar.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/modal.css"
    >

    <link
        rel="stylesheet"
        href="../css/components/signals.css"
    >
</head>


<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <!-- Logo -->
            <a
                href="../index.html"
                class="navbar-logo"
                aria-label="Kindling home"
            >
                <span class="navbar-logo-mark"></span>
                <span>KINDLING</span>
            </a>


            <!-- Desktop navigation -->
            <nav
                class="navbar-links"
                aria-label="Main navigation"
            >

                <a
                    href="./signals.html"
                    class="navbar-link active"
                >
                    Signals
                </a>

                <a
                    href="./inference.html"
                    class="navbar-link"
                >
                    Inference
                </a>

                <a
                    href="./career-graph.html"
                    class="navbar-link"
                >
                    Career Graph
                </a>

                <a
                    href="./user-control.html"
                    class="navbar-link"
                >
                    User Control
                </a>

                <a
                    href="./about.html"
                    class="navbar-link"
                >
                    About
                </a>

            </nav>


            <!-- Sign in -->
            <button
                type="button"
                class="navbar-action"
                id="signInButton"
            >
                Sign in
            </button>


            <!-- Mobile menu -->
            <button
                class="navbar-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >

                <span class="navbar-menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         SIGNALS PAGE
    ====================================================== -->

    <main class="signals-page">

        <section class="signals-section">

            <div class="signals-container">


                <!-- =================================================
                     WELCOME / OPENING QUESTION
                ================================================== -->

                <div
                    class="signals-welcome"
                    id="signalsWelcome"
                >

                    <p class="signals-welcome-label">
                        KINDLING
                    </p>

                    <h1 class="signals-welcome-title">
                        Let's get curious.
                    </h1>

                    <p
                        class="signals-question"
                        id="openingQuestion"
                    >
                        What have you been curious about lately — even
                        something small?
                    </p>

                </div>



                <!-- =================================================
                     CHAT
                ================================================== -->

                <div
                    class="chat-container"
                    id="chatContainer"
                >

                    <div
                        class="chat-messages"
                        id="chatMessages"
                        aria-live="polite"
                    >
                    </div>

                </div>



                <!-- =================================================
                     INPUT
                ================================================== -->

                <div class="signals-input-area">

                    <form
                        class="chat-form"
                        id="chatForm"
                    >

                        <div class="chat-input-wrapper">

                            <textarea
                                id="chatInput"
                                class="chat-input"
                                rows="1"
                                placeholder="Tell us what's on your mind..."
                                aria-label="Your response"
                                required
                            ></textarea>


                            <button
                                type="submit"
                                class="chat-send"
                                id="chatSend"
                                aria-label="Send response"
                            >

                                <span class="chat-send-icon">
                                    ↑
                                </span>

                            </button>

                        </div>


                        <div class="chat-meta">

                            <span>
                                No right answers. Just explore.
                            </span>

                            <span id="questionProgress">
                                Question 1 of 7
                            </span>

                        </div>

                    </form>



                    <!-- Loading indicator -->
                    <div
                        class="chat-loading"
                        id="chatLoading"
                        aria-hidden="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         SIGN-IN MODAL
    ====================================================== -->

    <div
        class="modal"
        id="signInModal"
        aria-hidden="true"
    >

        <div class="modal-overlay"></div>

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="signInModalTitle"
        >

            <button
                type="button"
                class="modal-close"
                id="closeSignInModal"
                aria-label="Close sign in"
            >
                ×
            </button>


            <div class="modal-header">

                <p class="modal-eyebrow">
                    WELCOME BACK
                </p>

                <h2
                    class="modal-title"
                    id="signInModalTitle"
                >
                    Sign in to Kindling
                </h2>

                <p class="modal-description">
                    Continue exploring your interests and patterns.
                </p>

            </div>


            <form
                class="modal-form"
                id="signInForm"
            >

                <div class="form-group">

                    <label for="signInEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signInEmail"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signInPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signInPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button button-primary modal-submit"
                >
                    Sign in
                </button>

            </form>

        </div>

    </div>



    <!-- =====================================================
         SIGNALS JAVASCRIPT
    ====================================================== -->

    <script src="../js/pages/signals.js"></script>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            initializeSignals();

        });
    </script>

</body>

</html>
